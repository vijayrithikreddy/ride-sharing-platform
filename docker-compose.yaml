services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rideshare-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rideshare
      RABBITMQ_DEFAULT_PASS: rideshare123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: